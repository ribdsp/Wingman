# Spending policies for the Wingman goal engine.
#
# This file is owned by the operator and read once at startup. There is no API
# that writes it: an agent able to edit its own spending limits has no limits.
#
# Read the default carefully. An action type with NO policy here is not
# unlimited — it requires a human every time. That is why this file ships empty:
# until you write a limit down, nothing spends money without you.
#
# Each policy answers one question per request: approve it, ask a human, or refuse.
#
#   autoApproveBelow  under this amount, the action proceeds and is recorded
#   dailyCap          total per action type per day; a request that would cross it
#                     is refused, not queued
#   hardCap           a single request above this is refused outright
#   currency          the unit all three are in; requests in another are refused
#   enabled           false refuses every request of this type
#
# The caps refuse rather than escalate on purpose. An operator asked to rubber-stamp
# a cap breach will eventually rubber-stamp it, so raising a cap is a configuration
# change you make deliberately, not an approval you click through at midnight. What
# reaches a human is the middle band: at or above autoApproveBelow, still inside
# both caps.
#
# autoApproveBelow must sit below both caps, or the caps would never be reached.
# Amounts are plain numbers in the currency's main unit, never its subunit — for USD
# that is dollars, so 12.50 is twelve dollars fifty and never twelve hundred and fifty
# cents. Four decimal places are stored, so write the fraction when you need it.

policies: []

# ---------------------------------------------------------------------------
# A worked example. Copy it, change the numbers to ones you would be willing to
# lose to a bug, and remove the empty list above.
#
# These say: an ad spend under 100 dollars proceeds on its own; between 100 and
# the caps it waits for you; anything that would take the day past 500, or any
# single request above 5,000, is refused outright.
# ---------------------------------------------------------------------------
# policies:
#   - actionType: ads.spend
#     description: Paid acquisition, topped up by the growth agent
#     currency: USD
#     autoApproveBelow: 100
#     dailyCap: 500
#     hardCap: 5000
#
#   - actionType: tools.subscription
#     description: SaaS the agent signs up for on its own
#     currency: USD
#     autoApproveBelow: 0        # nothing is hands-off; every request asks you
#     dailyCap: 1000
#     hardCap: 1000
#
#   - actionType: payout.vendor
#     description: Paying a freelancer or vendor invoice
#     currency: USD
#     autoApproveBelow: 0
#     dailyCap: 10000
#     hardCap: 10000
#     enabled: false             # written down, and refused until you flip this
