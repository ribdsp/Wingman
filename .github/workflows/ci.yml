# Continuous integration for the Wingman goal engine.
#
# The race detector runs here and only here: it needs cgo and a C toolchain, which
# not every contributor has, so `make test` stays cgo-free and this job is what
# guarantees nothing merges unraced.
#
# Everything runs against goal-engine/. core/ is a separate repository (a fork of
# Rakazo) and is not part of this history, so there is nothing here to build for it.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: goal-engine

env:
  # The suite needs no database, no network and no fixtures. If that ever stops
  # being true, it is a bug in the test, not a missing service here.
  CGO_ENABLED: 0

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Single source of truth: bump go.mod, not this file.
          go-version-file: goal-engine/go.mod
          cache-dependency-path: goal-engine/go.sum

      - name: Formatting
        run: |
          unformatted="$(gofmt -l ./cmd/ ./internal/)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Test under the race detector
        env:
          CGO_ENABLED: 1
        run: go test -race ./...

      - name: Coverage
        run: |
          go test -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tail -1
          total="$(go tool cover -func=coverage.out | awk 'END {gsub(/%/, "", $3); print $3}')"
          echo "total coverage: ${total}%"
          # The project bar is 80%. The suite has been well above it since the
          # decision core was written; a drop below is a change worth arguing for
          # in the pull request rather than something to notice three months later.
          awk -v t="$total" 'BEGIN { exit (t + 0 >= 80) ? 0 : 1 }' || {
            echo "coverage ${total}% is below the 80% bar"
            exit 1
          }

      - name: Verify the migrations directory is not empty
        run: test -n "$(ls -A migrations)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: goal-engine/coverage.out
          retention-days: 7

  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    # Advisory on purpose, for now. golangci-lint's standard set flags patterns this
    # codebase uses deliberately (unchecked `defer tx.Rollback()`, for one), and a
    # red pipeline that everybody learns to ignore is worse than an amber one they
    # read. Triage the findings, add the exclusions that are genuinely intended,
    # then delete this comment and the continue-on-error below.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: goal-engine/go.mod
          cache-dependency-path: goal-engine/go.sum

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: goal-engine

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Syntax
        run: bash -n scripts/*.sh

      - name: shellcheck
        run: shellcheck scripts/*.sh

  container:
    name: Container and compose
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: |
          docker build \
            --build-arg VERSION="ci-${GITHUB_SHA::12}" \
            -t wingman/goal-engine:ci \
            goal-engine

      - name: The image runs as a non-root user
        run: |
          user="$(docker image inspect wingman/goal-engine:ci --format '{{.Config.User}}')"
          echo "image user: ${user:-<empty>}"
          case "$user" in
            nonroot*|65532*) ;;
            *) echo "the image must not run as root"; exit 1 ;;
          esac

      - name: The image contents are what they should be
        run: |
          # The image is distroless: no shell, so its filesystem is inspected from
          # outside. docker export flattens the container, which is what a running
          # process actually sees.
          cid="$(docker create wingman/goal-engine:ci)"
          docker export "$cid" | tar -t > /tmp/fs.txt
          docker rm "$cid" >/dev/null

          # .dockerignore excludes .env; this proves the exclusion holds. It scans
          # the flattened filesystem, so it would not catch a secret added and then
          # deleted in a later layer — the Dockerfile copies no secret at any stage,
          # which is the property that makes that unreachable.
          if grep -qE '(^|/)\.env(\..*)?$' /tmp/fs.txt; then
            echo "an environment file is present in the image:"
            grep -E '(^|/)\.env(\..*)?$' /tmp/fs.txt
            exit 1
          fi

          # The binary needs both of these at the paths it defaults to.
          grep -q '^app/goal-engine$' /tmp/fs.txt || { echo "binary missing"; exit 1; }
          grep -q '^app/migrations/' /tmp/fs.txt  || { echo "migrations missing"; exit 1; }
          grep -q '^app/config/'     /tmp/fs.txt  || { echo "config missing"; exit 1; }

      - name: The compose stack is valid
        run: |
          # POSTGRES_PASSWORD has no default in the compose file, so this also
          # proves .env.example carries every variable the stack needs.
          cp goal-engine/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml config -q
          rm deploy/.env
